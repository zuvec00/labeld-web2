name: Hidden code check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  hidden-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/check-hidden-code.mjs
